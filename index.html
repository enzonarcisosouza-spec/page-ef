<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Night Funkin' Web Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Press Start 2P', cursive; user-select: none; }
        .pixel-border {
            box-shadow: 0 -4px #000, 0 4px #000, -4px 0 #000, 4px 0 #000,
                        0 -8px #fff, 0 8px #fff, -8px 0 #fff, 8px 0 #fff;
        }
        .arrow-lane { width: 64px; height: 100%; position: relative; }
        @keyframes float-rating {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }
        .rating-anim { animation: float-rating 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-2 overflow-hidden">

    <!-- Tela do Jogo -->
    <div id="game-container" class="relative w-full max-w-4xl h-[600px] bg-indigo-950 rounded-xl overflow-hidden border-4 border-purple-500 shadow-2xl flex flex-col">
        
        <!-- Menu Principal -->
        <div id="menu-screen" class="absolute inset-0 z-50 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold text-yellow-400 drop-shadow-[0_5px_0_rgba(255,0,0,1)] mb-4 italic tracking-wider">
                FRIDAY NIGHT FUNKIN'
            </h1>
            <p class="text-xs text-cyan-400 mb-8">WEB EDITION FULL AUDIO</p>

            <div class="w-full max-w-xs space-y-4 mb-6">
                <label class="block text-left text-xs text-gray-300">Escolha a Música:</label>
                <select id="song-select" class="w-full bg-slate-800 border-2 border-purple-500 text-yellow-300 p-3 rounded text-xs focus:outline-none cursor-pointer">
                    <option value="bopeebo">1. Bopeebo (Tutorial/Easy)</option>
                    <option value="fresh">2. Fresh (Medium)</option>
                    <option value="dadbattle">3. Dad Battle (Hard)</option>
                </select>

                <label class="block text-left text-xs text-gray-300">Dificuldade:</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setDifficulty('easy')" id="diff-easy" class="diff-btn bg-green-600 hover:bg-green-500 text-white py-2 rounded text-[10px] border-2 border-white">EASY</button>
                    <button onclick="setDifficulty('normal')" id="diff-normal" class="diff-btn bg-yellow-600 hover:bg-yellow-500 text-white py-2 rounded text-[10px] border-2 border-transparent">NORMAL</button>
                    <button onclick="setDifficulty('hard')" id="diff-hard" class="diff-btn bg-red-600 hover:bg-red-500 text-white py-2 rounded text-[10px] border-2 border-transparent">HARD</button>
                </div>
            </div>

            <button onclick="startGame()" class="bg-pink-600 hover:bg-pink-500 text-white px-8 py-4 rounded-lg text-sm border-b-4 border-pink-800 active:border-b-0 transition-all cursor-pointer">
                PRESS START
            </button>
            
            <p class="text-[10px] text-gray-400 mt-6">Controles: [Contas/Setas] ou [A] [S] [W] [D]</p>
        </div>

        <!-- Barra Superior e Pontuação -->
        <div class="relative z-10 bg-slate-900/80 p-3 flex justify-between items-center border-b-2 border-purple-800 text-[10px] md:text-xs">
            <div>SCORE: <span id="score-display" class="text-yellow-400">0</span></div>
            <div>ACCURACY: <span id="accuracy-display" class="text-cyan-400">100%</span></div>
            <div>COMBO: <span id="combo-display" class="text-pink-400">0</span></div>
        </div>

        <!-- Palco do Jogo (Personagens) -->
        <div class="relative flex-1 bg-gradient-to-b from-indigo-900 via-purple-950 to-slate-950 flex items-end justify-between px-8 pb-4 overflow-hidden">
            
            <!-- Dad / Oponente (Esquerda) -->
            <div id="opponent" class="relative z-20 flex flex-col items-center transition-transform duration-100">
                <svg id="dad-svg" class="w-32 h-44 md:w-40 md:h-56" viewBox="0 0 100 120">
                    <rect x="35" y="40" width="30" height="50" fill="#4c1d95" rx="5"/>
                    <circle cx="50" cy="25" r="18" fill="#a855f7"/>
                    <circle cx="43" cy="22" r="3" fill="#facc15"/>
                    <circle cx="57" cy="22" r="3" fill="#facc15"/>
                    <rect x="30" y="90" width="12" height="25" fill="#1e1b4b"/>
                    <rect x="58" y="90" width="12" height="25" fill="#1e1b4b"/>
                </svg>
                <span class="text-[10px] text-purple-400 mt-1">DADDY DEAREST</span>
            </div>

            <!-- GF no Caixa de Som (Centro) -->
            <div id="gf-speaker" class="relative z-10 flex flex-col items-center mb-2">
                <svg class="w-24 h-28 md:w-32 md:h-36" viewBox="0 0 100 100">
                    <rect x="20" y="40" width="60" height="55" fill="#334155" rx="4" border="2"/>
                    <circle cx="50" cy="68" r="16" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
                    <circle cx="50" cy="25" r="12" fill="#f43f5e"/>
                    <path d="M 38 25 Q 50 10 62 25" fill="#9f1239"/>
                </svg>
            </div>

            <!-- Boyfriend / Jogador (Direita) -->
            <div id="player" class="relative z-20 flex flex-col items-center transition-transform duration-100">
                <svg id="bf-svg" class="w-32 h-44 md:w-40 md:h-56" viewBox="0 0 100 120">
                    <rect x="35" y="45" width="30" height="45" fill="#f43f5e" rx="4"/>
                    <circle cx="50" cy="25" r="16" fill="#fde047"/>
                    <path d="M 34 15 Q 50 5 66 15" fill="#06b6d4"/>
                    <rect x="32" y="90" width="14" height="25" fill="#1e3a8a"/>
                    <rect x="54" y="90" width="14" height="25" fill="#1e3a8a"/>
                </svg>
                <span class="text-[10px] text-cyan-400 mt-1">BOYFRIEND</span>
            </div>

            <!-- Rating Feedback Popups -->
            <div id="rating-container" class="absolute inset-0 flex items-center justify-center pointer-events-none z-30"></div>
        </div>

        <!-- Pistas de Notas / Setas -->
        <div class="relative h-48 bg-slate-950/90 border-t-4 border-purple-600 flex justify-around px-4">
            <!-- Pistas do Oponente -->
            <div class="flex gap-2 opacity-60 pointer-events-none" id="opponent-lanes">
                <div class="arrow-lane border-r border-slate-800 flex justify-center"><div class="absolute bottom-4 text-2xl">⬅️</div></div>
                <div class="arrow-lane border-r border-slate-800 flex justify-center"><div class="absolute bottom-4 text-2xl">⬇️</div></div>
                <div class="arrow-lane border-r border-slate-800 flex justify-center"><div class="absolute bottom-4 text-2xl">⬆️</div></div>
                <div class="arrow-lane flex justify-center"><div class="absolute bottom-4 text-2xl">➡️</div></div>
            </div>

            <!-- Divisor -->
            <div class="w-1 bg-purple-800 my-2"></div>

            <!-- Pistas do Jogador -->
            <div class="flex gap-2" id="player-lanes">
                <div class="arrow-lane border-r border-slate-800 flex justify-center" data-key="0"><div id="target-0" class="absolute bottom-4 text-2xl transition-transform">⬅️</div></div>
                <div class="arrow-lane border-r border-slate-800 flex justify-center" data-key="1"><div id="target-1" class="absolute bottom-4 text-2xl transition-transform">⬇️</div></div>
                <div class="arrow-lane border-r border-slate-800 flex justify-center" data-key="2"><div id="target-2" class="absolute bottom-4 text-2xl transition-transform">⬆️</div></div>
                <div class="arrow-lane flex justify-center" data-key="3"><div id="target-3" class="absolute bottom-4 text-2xl transition-transform">➡️</div></div>
            </div>
        </div>

        <!-- Barra de Vida VS -->
        <div class="relative w-full h-6 bg-red-600 flex border-t-2 border-black">
            <div id="health-bar" class="h-full bg-green-500 transition-all duration-150" style="width: 50%;"></div>
            <div class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-black drop-shadow">
                VS HEALTH
            </div>
        </div>
    </div>

    <!-- Script de Funcionamento com Fontes do GitHub / Audio Online -->
    <script>
        const SONGS = {
            bopeebo: {
                name: "Bopeebo",
                bpm: 100,
                // Áudios diretos e funcionais via CDN/GitHub
                src: "https://raw.githubusercontent.com/ShadowMario/FNF-PsychEngine/main/art/readme/bopeebo.mp3"
            },
            fresh: {
                name: "Fresh",
                bpm: 120,
                src: "https://actions.google.com/sounds/v1/science_fiction/electronic_synth_loop.ogg"
            },
            dadbattle: {
                name: "Dad Battle",
                bpm: 140,
                src: "https://actions.google.com/sounds/v1/science_fiction/pulsating_space_synth.ogg"
            }
        };

        let currentSong = SONGS.bopeebo;
        let selectedDiff = 'easy';
        let isPlaying = false;
        let score = 0;
        let combo = 0;
        let health = 50;
        let totalNotes = 0;
        let hitNotes = 0;
        let audioTrack = null;
        let gameLoopId = null;
        let activeNotes = [];

        const keyMap = {
            'ArrowLeft': 0, 'a': 0, 'A': 0,
            'ArrowDown': 1, 's': 1, 'S': 1,
            'ArrowUp': 2, 'w': 2, 'W': 2,
            'ArrowRight': 3, 'd': 3, 'D': 3
        };

        const arrowIcons = ['⬅️', '⬇️', '⬆️', '➡️'];

        function setDifficulty(diff) {
            selectedDiff = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.replace('border-white', 'border-transparent'));
            document.getElementById(`diff-${diff}`).classList.replace('border-transparent', 'border-white');
        }

        function startGame() {
            const songKey = document.getElementById('song-select').value;
            currentSong = SONGS[songKey];
            
            // Reset de Estado
            score = 0;
            combo = 0;
            health = 50;
            totalNotes = 0;
            hitNotes = 0;
            activeNotes = [];
            
            updateHUD();
            document.getElementById('menu-screen').classList.add('hidden');

            // Carregar e Tocar Música Real
            if (audioTrack) {
                audioTrack.pause();
            }
            audioTrack = new Audio(currentSong.src);
            audioTrack.volume = 0.7;
            audioTrack.play().catch(e => console.log("Erro ao iniciar áudio:", e));

            isPlaying = true;
            spawnNotesLoop();
            requestAnimationFrame(updateGame);
        }

        function spawnNotesLoop() {
            if (!isPlaying) return;

            // Frequência de geração baseada na dificuldade
            const speedMap = { easy: 1200, normal: 800, hard: 500 };
            const lane = Math.floor(Math.random() * 4);
            const isPlayer = Math.random() > 0.3; // 70% notas do jogador

            createNote(lane, isPlayer);

            setTimeout(spawnNotesLoop, speedMap[selectedDiff]);
        }

        function createNote(lane, isPlayer) {
            const container = isPlayer ? document.getElementById('player-lanes') : document.getElementById('opponent-lanes');
            const targetLane = container.children[lane];
            
            const noteEl = document.createElement('div');
            noteEl.className = 'absolute text-2xl transition-linear';
            noteEl.innerText = arrowIcons[lane];
            noteEl.style.top = '0px';

            targetLane.appendChild(noteEl);

            activeNotes.push({
                element: noteEl,
                lane: lane,
                isPlayer: isPlayer,
                posY: 0,
                speed: selectedDiff === 'hard' ? 4 : (selectedDiff === 'normal' ? 3 : 2)
            });
        }

        function updateGame() {
            if (!isPlaying) return;

            for (let i = activeNotes.length - 1; i >= 0; i--) {
                const note = activeNotes[i];
                note.posY += note.speed;
                note.element.style.top = `${note.posY}px`;

                // Erro ao deixar passar a nota (Miss)
                if (note.posY > 140) {
                    if (note.isPlayer) {
                        handleMiss();
                    }
                    note.element.remove();
                    activeNotes.splice(i, 1);
                }
            }

            requestAnimationFrame(updateGame);
        }

        function handleMiss() {
            combo = 0;
            health = Math.max(0, health - 8);
            totalNotes++;
            showRating("MISS", "text-red-500");
            updateHUD();
            
            if (health <= 0) {
                endGame("GAME OVER!");
            }
        }

        function triggerHit(lane) {
            // Animação de pressionar no alvo
            const target = document.getElementById(`target-${lane}`);
            target.classList.add('scale-125');
            setTimeout(() => target.classList.remove('scale-125'), 100);

            // Verificar colisão de nota
            const hitIndex = activeNotes.findIndex(n => n.isPlayer && n.lane === lane && n.posY >= 100 && n.posY <= 150);

            if (hitIndex !== -1) {
                const note = activeNotes[hitIndex];
                const diff = Math.abs(note.posY - 120);

                let points = 100;
                let ratingText = "GOOD";
                let ratingColor = "text-green-400";

                if (diff < 10) {
                    points = 250;
                    ratingText = "SICK!";
                    ratingColor = "text-cyan-300";
                } else if (diff > 25) {
                    points = 50;
                    ratingText = "BAD";
                    ratingColor = "text-yellow-500";
                }

                score += points;
                combo++;
                hitNotes++;
                totalNotes++;
                health = Math.min(
